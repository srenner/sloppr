<section
  class="min-h-[calc(100vh-64px)] bg-canvas px-4 py-8 print:min-h-0 print:bg-white print:p-0"
>
  <div class="mx-auto w-full max-w-3xl">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-2 print:hidden">
      <a
        routerLink="/cookbook"
        class="text-sm font-medium text-fg-subtle hover:text-fg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2 focus-visible:ring-offset-canvas"
      >
        ← Family cookbook
      </a>
      <button
        type="button"
        class="rounded-lg border border-border-strong bg-surface px-3 py-1.5 text-sm font-medium text-fg-muted hover:bg-surface-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2 focus-visible:ring-offset-canvas"
        (click)="print()"
      >
        Print / Save as PDF
      </button>
    </div>

    @if (loading()) {
      <p class="text-sm text-fg-subtle" aria-live="polite">Loading recipe…</p>
    } @else if (error(); as message) {
      <p
        role="alert"
        class="rounded-lg border border-danger-border bg-danger-surface px-4 py-3 text-sm text-danger"
      >
        {{ message }}
      </p>
    } @else if (markdown(); as content) {
      <article
        class="recipe-paper mx-auto bg-surface px-8 py-10 shadow-xl sm:px-12 sm:py-14 print:px-0 print:py-0 print:shadow-none"
      >
        <app-markdown-view [markdown]="content" />
      </article>
    }
  </div>
</section>
