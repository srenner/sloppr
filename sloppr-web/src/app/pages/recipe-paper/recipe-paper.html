<section class="min-h-[calc(100vh-64px)] bg-gray-100 px-4 py-8 print:min-h-0 print:bg-white print:p-0">
  <div class="mx-auto w-full max-w-3xl">
    <div class="mb-4 flex items-center justify-between print:hidden">
      <a
        routerLink="/recipes"
        class="text-sm font-medium text-gray-500 hover:text-gray-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-800 focus-visible:ring-offset-2"
      >
        ← All recipes
      </a>
      <button
        type="button"
        class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-800 focus-visible:ring-offset-2"
        (click)="print()"
      >
        Print / Save as PDF
      </button>
    </div>

    @if (loading()) {
      <p class="text-sm text-gray-500" aria-live="polite">Loading recipe…</p>
    } @else if (error(); as message) {
      <p role="alert" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
        {{ message }}
      </p>
    } @else if (markdown(); as content) {
      <article
        class="recipe-paper mx-auto bg-white px-8 py-10 shadow-xl sm:px-12 sm:py-14 print:px-0 print:py-0 print:shadow-none"
      >
        <app-markdown-view [markdown]="content" />
      </article>
    }
  </div>
</section>
