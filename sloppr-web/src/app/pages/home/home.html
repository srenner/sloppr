<section class="flex min-h-[calc(100vh-64px)] items-center justify-center px-4">
  <div class="w-full max-w-2xl">
    <h1 class="mb-6 text-center text-3xl font-semibold text-gray-800">What's cooking?</h1>

    <form
      class="rounded-2xl border border-gray-300 bg-white p-3 shadow-sm focus-within:border-gray-400"
      (submit)="send(); $event.preventDefault()"
    >
      <label class="sr-only" for="prompt">Message</label>
      <textarea
        id="prompt"
        class="w-full resize-none border-0 bg-transparent px-2 py-1 text-base text-gray-800 outline-none placeholder:text-gray-400"
        rows="3"
        autofocus
        placeholder="Ask for a meal idea, paste a recipe, or describe what's in your fridge..."
        [value]="prompt()"
        (input)="onInput($event)"
      ></textarea>

      <div class="flex justify-end">
        <button
          type="submit"
          class="rounded-lg bg-gray-800 px-4 py-2 text-sm font-medium text-white hover:bg-gray-700 disabled:cursor-not-allowed disabled:opacity-40"
          [disabled]="!canSend()"
        >
          Send
        </button>
      </div>
    </form>

    @if (lastPrompt(); as last) {
      <p class="mt-4 text-center text-sm text-gray-500">Last prompt: "{{ last }}"</p>
    }
  </div>
</section>
