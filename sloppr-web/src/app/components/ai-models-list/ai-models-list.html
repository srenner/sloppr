<h2>Active AI Models</h2>
@if(models().length > 0) {
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Identifier</th>
        <th>Provider</th>
        <th>Context Window</th>
      </tr>
    </thead>
    <tbody>
      @for (model of models(); track model.id) {
        <tr>
          <td>{{ model.name }}</td>
          <td>{{ model.identifier }}</td>
          <td>{{ model.aiProvider?.name || 'N/A' }}</td>
          <td>{{ model.contextWindow || 'N/A' }}</td>
        </tr>
      }
    </tbody>
  </table>
}
@else {
  <p>No active AI models found.</p>
}
