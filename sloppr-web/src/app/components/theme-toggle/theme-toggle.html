<button
  type="button"
  class="rounded-lg p-1.5 text-nav-fg hover:bg-nav-hover hover:text-on-strong focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus"
  [attr.aria-label]="label()"
  [title]="label()"
  (click)="cycle()"
>
  @switch (mode()) {
    @case ('light') {
      <svg lucideSun [size]="20"></svg>
    }
    @case ('dark') {
      <svg lucideMoon [size]="20"></svg>
    }
    @default {
      <svg lucideMonitor [size]="20"></svg>
    }
  }
</button>
