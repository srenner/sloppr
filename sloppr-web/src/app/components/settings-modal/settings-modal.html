<dialog
  #dialog
  class="m-auto w-full max-w-4xl rounded-2xl border border-border bg-surface p-0 shadow-xl backdrop:bg-black/50"
  (click)="onBackdropClick($event)"
  (close)="onClose()"
>
  <div class="flex max-h-[85vh] flex-col">
    <header class="flex items-center justify-between border-b border-border px-6 py-4">
      <h2 class="text-xl font-semibold text-fg">Settings</h2>
      <button
        type="button"
        class="rounded-lg px-2 py-1 text-2xl leading-none text-fg-subtle hover:bg-surface-muted hover:text-fg"
        aria-label="Close settings"
        (click)="close()"
      >
        &times;
      </button>
    </header>

    @if (isOpen()) {
      <div class="flex min-h-0 flex-1">
        <nav
          class="w-44 shrink-0 space-y-1 border-r border-border px-3 py-4"
          aria-label="Settings sections"
        >
          <button
            type="button"
            role="tab"
            class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium"
            [class.bg-surface-muted]="tab() === 'provider'"
            [class.text-fg]="tab() === 'provider'"
            [class.text-fg-muted]="tab() !== 'provider'"
            [attr.aria-selected]="tab() === 'provider'"
            (click)="selectTab('provider')"
          >
            Provider
          </button>
          <button
            type="button"
            role="tab"
            class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium"
            [class.bg-surface-muted]="tab() === 'models'"
            [class.text-fg]="tab() === 'models'"
            [class.text-fg-muted]="tab() !== 'models'"
            [attr.aria-selected]="tab() === 'models'"
            (click)="selectTab('models')"
          >
            Models
          </button>
          <button
            type="button"
            role="tab"
            class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium"
            [class.bg-surface-muted]="tab() === 'capabilities'"
            [class.text-fg]="tab() === 'capabilities'"
            [class.text-fg-muted]="tab() !== 'capabilities'"
            [attr.aria-selected]="tab() === 'capabilities'"
            (click)="selectTab('capabilities')"
          >
            Capabilities
          </button>
        </nav>

        <div class="min-w-0 flex-1 overflow-y-auto px-6 py-4">
          @switch (tab()) {
            @case ('provider') {
              <app-settings-provider />
            }
            @case ('models') {
              <app-settings-models />
            }
            @case ('capabilities') {
              <app-settings-capabilities />
            }
          }
        </div>
      </div>
    }
  </div>
</dialog>
