<dialog
  #dialog
  class="m-auto w-full max-w-4xl rounded-2xl border border-gray-200 bg-white p-0 shadow-xl backdrop:bg-black/50"
  (click)="onBackdropClick($event)"
  (close)="onClose()"
>
  <div class="flex max-h-[85vh] flex-col">
    <header class="flex items-center justify-between border-b border-gray-200 px-6 py-4">
      <h2 class="text-xl font-semibold text-gray-800">Settings</h2>
      <button
        type="button"
        class="rounded-lg px-2 py-1 text-2xl leading-none text-gray-500 hover:bg-gray-100 hover:text-gray-800"
        aria-label="Close settings"
        (click)="close()"
      >
        &times;
      </button>
    </header>

    @if (isOpen()) {
      <div class="flex min-h-0 flex-1">
        <nav
          class="w-44 shrink-0 space-y-1 border-r border-gray-200 px-3 py-4"
          aria-label="Settings sections"
        >
          <button
            type="button"
            role="tab"
            class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium"
            [class.bg-gray-100]="tab() === 'provider'"
            [class.text-gray-900]="tab() === 'provider'"
            [class.text-gray-600]="tab() !== 'provider'"
            [attr.aria-selected]="tab() === 'provider'"
            (click)="selectTab('provider')"
          >
            Provider
          </button>
          <button
            type="button"
            role="tab"
            class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium"
            [class.bg-gray-100]="tab() === 'models'"
            [class.text-gray-900]="tab() === 'models'"
            [class.text-gray-600]="tab() !== 'models'"
            [attr.aria-selected]="tab() === 'models'"
            (click)="selectTab('models')"
          >
            Models
          </button>
          <button
            type="button"
            role="tab"
            class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium"
            [class.bg-gray-100]="tab() === 'defaults'"
            [class.text-gray-900]="tab() === 'defaults'"
            [class.text-gray-600]="tab() !== 'defaults'"
            [attr.aria-selected]="tab() === 'defaults'"
            (click)="selectTab('defaults')"
          >
            Defaults
          </button>
        </nav>

        <div class="min-w-0 flex-1 overflow-y-auto px-6 py-4">
          @switch (tab()) {
            @case ('provider') {
              <app-settings-provider />
            }
            @case ('models') {
              <app-settings-models />
            }
            @case ('defaults') {
              <app-settings-defaults />
            }
          }
        </div>
      </div>
    }
  </div>
</dialog>
